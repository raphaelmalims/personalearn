name: Bug report
description: Report broken behavior. The team will create a Jira ticket (PSL-N) for tracking.
title: "[Bug] "
labels: ["needs-triage", "type-bug"]
assignees:
  - nervustech
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. We'll triage this and create a **Jira ticket (`PSL-N`)** for tracking.
        For urgent production issues, contact the team directly.

        **Do not paste secrets** (passwords, API keys, `.env` values).

        On create this issue is assigned to **nervustech**, labelled `needs-triage` + `type-bug` (not GitHub's default `bug` label), and should get a **milestone** (current sprint or Backlog) at triage. Triage adds exactly one **`area-*`** label (`area-auth`, `area-dashboard`, `area-classes`, `area-ai-rag`, `area-infra`, or `area-docs`).

        **Gold bar:** See [docs/sdlc-writing-standard.md](https://github.com/raphaelmalims/personalearn/blob/develop/docs/sdlc-writing-standard.md) and [issue #129](https://github.com/raphaelmalims/personalearn/issues/129).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or more sentences — what is broken, for whom, and root cause if already known.
      placeholder: |
        After the PSL-104 fix, AI Hub stopped streaming because visibleMessages sliced off the active assistant message during isGenerating.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging / Vercel preview
        - Local development
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL (if applicable)
      placeholder: "https://personalearn-xxx.vercel.app/classes/..."

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps another person can follow.
      placeholder: |
        1. Sign in as a teacher with an existing class
        2. Go to Students → Import CSV
        3. Upload the attached file
        4. Click Import
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: P0 = app unusable; P1 = major workflow blocked; P2 = annoyance (maps to Jira priority at triage)
      options:
        - P0 — Critical (cannot use the app)
        - P1 — Major (important workflow broken)
        - P2 — Minor (cosmetic or workaround exists)
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Checkbox-friendly list of done conditions (copied to Jira when triaged).
      placeholder: |
        - [ ] Reproduction steps no longer trigger the bug
        - [ ] Regression test or manual verify step documented
        - [ ] Related workflows still work
    validations:
      required: true

  - type: textarea
    id: likely_cause
    attributes:
      label: Likely cause / notes
      description: Optional — suspected root cause, related PRs/tickets, or investigation notes.
      placeholder: |
        Root cause: ...
        Related: PSL-__ / PR #__

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, error messages, sample files (redact PII). Drag files into the comment after submitting if needed.
      placeholder: |
        Console error:
        Network response:

  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: "Chrome 125 on Android 14"

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Frequency, when it started, etc.
